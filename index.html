<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Analytics: none yet. QuFree's Google Analytics tags were removed so
       Naqatar traffic doesn't land in QuFree's property (ROADMAP P6: own GA). -->

  <!-- Performance: preconnect to external origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
  <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />

  <!-- Fonts: non-render-blocking via <link> instead of CSS @import -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" /></noscript>

  <!-- PWA -->
  <meta name="theme-color" content="#1D565D" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Naqatar" />
  <meta name="msapplication-TileColor" content="#1D565D" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- SEO -->
  <meta name="description" content="Find any medical or aesthetic clinic by its number and book an appointment instantly on Naqatar." />
  <meta name="keywords" content="clinic appointment, doctor booking, aesthetic clinic, dental, skin clinic, Pakistan, Naqatar" />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="TechPeer / Naqatar" />
  <link rel="canonical" href="https://naqatar.web.app/" />

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://naqatar.web.app/" />
  <meta property="og:site_name" content="Naqatar" />
  <meta property="og:title" content="Naqatar: Clinic appointments made easy" />
  <meta property="og:description" content="Find any medical or aesthetic clinic by its number and book an appointment instantly." />
  <meta property="og:image" content="https://naqatar.web.app/og-image-naqatar.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="628" />
  <meta property="og:image:alt" content="Naqatar logo" />
  <meta property="og:logo" content="https://naqatar.web.app/icons-naqatar/icon-512x512.png" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Naqatar: Clinic appointments made easy" />
  <meta name="twitter:description" content="Find any medical or aesthetic clinic by its number and book an appointment instantly." />
  <meta name="twitter:image" content="https://naqatar.web.app/og-image-naqatar.png" />
  <meta name="twitter:image:alt" content="Naqatar logo" />

  <!-- Icons -->
  <link rel="icon" type="image/png" href="/favicon-naqatar.png" />
  <link rel="apple-touch-icon" href="/icons-naqatar/apple-touch-icon.png" />

  <title>Naqatar: Clinic appointments made easy</title>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Naqatar",
    "description": "Find any medical or aesthetic clinic by its number and book an appointment instantly.",
    "url": "https://naqatar.web.app/",
    "logo": "https://naqatar.web.app/icons-naqatar/icon-512x512.png",
    "applicationCategory": "HealthApplication",
    "operatingSystem": "Web, Android, iOS",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "PKR" },
    "sameAs": []
  }
  </script>
</head>

<body>
  <div id="root">
    <!-- Inline loading shell — visible instantly, replaced by React the
         moment createRoot(...).render() runs (it overwrites #root). -->
    <style>
      #app-shell{position:fixed;inset:0;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;z-index:9999}
      #app-shell img{width:min(180px,50vw);height:auto}
      #app-shell .spinner{width:32px;height:32px;border:3px solid #F7F7F7;border-top-color:#1D565D;border-radius:50%;animation:spin 0.7s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
    <div id="app-shell" aria-hidden="true">
      <img src="/brand/naqatar-logo.png" alt="Naqatar" width="900" height="620" />
      <div class="spinner"></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
